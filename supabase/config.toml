# El juego llama a `game` sin header Authorization: la sesión va en `x-session` y la valida la propia
# función contra la tabla `sessions` (ver trainerFromSession). Con verify_jwt activado —el valor por
# defecto en proyectos nuevos— el gateway rechaza todo con UNAUTHORIZED_NO_AUTH_HEADER antes de que la
# función llegue a ejecutarse, incluidas las acciones públicas como `mart`.
[functions.game]
verify_jwt = false
